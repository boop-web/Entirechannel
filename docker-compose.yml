services:
  archiver:
    build: .
    image: yt-channel-archiver
    ports:
      # Open http://localhost:8000 in your browser after `docker compose up`.
      - "8000:8000"
    volumes:
      # All videos land in ./downloads on your host. Point this anywhere with
      # enough free space — a full channel can be very large.
      - ./downloads:/downloads
    environment:
      TZ: "${TZ:-UTC}"
    restart: unless-stopped
